/* ------------------------------------------------------------------

   divisor sequence: 1.4, 3, 5, 7, 9, 11, ...
   ------------------------------------------------------------------ */

function divisor(n) {
  return n === 0 ? 1.4 : 2 * n + 1;
}
function modifiedSainteLague(votes, seats) {
  const idx = {};
  const won = {};
  Object.keys(votes).forEach(p => {
    idx[p] = 0;
    won[p] = 0;
  });
  for (let s = 0; s < seats; s++) {
    let bestP = null;
    let bestQ = -1;
    for (const p of Object.keys(votes)) {
      if (votes[p] <= 0) continue;
      const q = votes[p] / divisor(idx[p]);
      if (q > bestQ) {
        bestQ = q;
        bestP = p;
      }
    }
    if (bestP === null) break;
    won[bestP] += 1;
    idx[bestP] += 1;
  }
  return won;
}
