<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxembourg seat projector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F5F8;
    --surface: #FFFFFF;
    --ink: #101B26;
    --muted: #566676;
    --line: #D6DDE4;
    --soft: #E8EDF2;
    --accent: #0079AB;
    --flag-red: #E4202B;
    --flag-blue: #00A1DE;
    --good: #12794A;
    --bad: #B3261E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D141B; --surface: #141E28; --ink: #E7EDF2; --muted: #97A5B2;
      --line: #263441; --soft: #1C2833; --accent: #4CC3EE; --good: #4CC38A; --bad: #FF8A80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D141B; --surface: #141E28; --ink: #E7EDF2; --muted: #97A5B2;
    --line: #263441; --soft: #1C2833; --accent: #4CC3EE; --good: #4CC38A; --bad: #FF8A80;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .flag { display: flex; height: 6px; }
  .flag i { flex: 1; }
  .flag i:nth-child(1) { background: var(--flag-red); }
  .flag i:nth-child(2) { background: #fff; }
  .flag i:nth-child(3) { background: var(--flag-blue); }

  .credit { margin: 28px 0 0; font-size: 12.5px; color: var(--muted); }
  .credit a { color: var(--accent); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 56px; }
  header { margin-bottom: 28px; max-width: 760px; }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(34px, 6vw, 60px);
    line-height: 0.98;
    font-weight: 800;
    font-stretch: 68%;
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--muted); font-size: 16px; max-width: 62ch; }

  .layout { display: grid; gap: 28px; grid-template-columns: 1fr; align-items: start; }

  h2 { margin: 0; font-size: 22px; font-weight: 750; font-stretch: 80%; line-height: 1.15; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  #in-h { margin-bottom: 0; }
  .controls .panel-head { margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

  button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--soft); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 11px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rows { display: grid; gap: 2px; }
  .row { display: grid; grid-template-columns: 1fr 100px; gap: 6px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--soft); }
  .row .pname { grid-column: 1 / -1; }
  @media (min-width: 680px) {
    .row { grid-template-columns: 300px 1fr 100px; padding: 6px 0; }
    .row .pname { grid-column: auto; }
  }
  .ac { color: var(--muted); font-weight: 500; }
  .row:first-child { border-top: 0; }
  .pname { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .sw { width: 10px; height: 22px; border-radius: 2px; flex: none; }
  .pname b { display: block; font-weight: 700; line-height: 1.1; font-size: 14px; }
  .pname small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; margin-top: 2px; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  .num { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 13px; }
  input[type=number] {
    width: 74px; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 5px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--ink); }
  .total strong { font-size: 18px; font-stretch: 80%; font-weight: 750; }
  .total .status { font-size: 13px; color: var(--muted); }
  .total .status.off { color: var(--bad); }

  .results { display: grid; gap: 28px; min-width: 0; }
  .hemi { margin: 8px auto 12px; max-width: 640px; }
  .hemi svg { display: block; width: 100%; height: auto; }

  .scroll { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--soft); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { font-weight: 600; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
  th small { display: block; font-weight: 400; font-size: 11.5px; }
  td.tot { font-weight: 800; font-size: 15px; }
  tr.dim td { color: var(--muted); }
  .party-cell { display: inline-flex; align-items: flex-start; gap: 8px; font-weight: 650; }
  .party-cell i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; margin-top: 5px; }
  .party-cell > span { white-space: normal; min-width: 150px; line-height: 1.3; }
  td:first-child { white-space: normal; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 0 0 14px; font-size: 13px; font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .up { color: var(--good); font-weight: 650; }
  .down { color: var(--bad); font-weight: 650; }
  .flat { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border-radius: 999px; background: var(--bg); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .coal-out { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .coal-out strong { font-size: 40px; font-weight: 800; font-stretch: 68%; line-height: 1; }
  .coal-out span { color: var(--muted); }
  .meter { position: relative; display: flex; height: 10px; background: var(--soft); border-radius: 5px; margin-top: 12px; overflow: hidden; }
  .meter b { display: block; height: 100%; flex: none; transition: width .15s; }
  .meter b + b { margin-left: 1px; }
  .meter u { position: absolute; left: 51.6667%; top: 0; bottom: 0; width: 2px; background: var(--flag-red); }
  @media (prefers-reduced-motion: reduce) { .meter b { transition: none; } }

  .map-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 0; }
  .map-filter .lbl { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .map-filter .chip { padding: 4px 11px 4px 8px; font-size: 13px; }
  .map-filter .chip i { width: 9px; height: 9px; }
  .gbar { width: 120px; height: 12px !important; border-radius: 3px !important; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 15%, var(--surface)), var(--c)); }
  .legend .nos i { border-radius: 3px; background: var(--soft); border: 1px solid var(--line); }
  .pop-row.focus { background: var(--soft); margin: 0 -6px; padding-left: 6px; padding-right: 6px; border-radius: 4px; }
  .map { position: relative; max-width: 460px; margin: 14px auto 12px; }
  .map svg { display: block; width: 100%; height: auto; overflow: visible; }
  .map .reg { cursor: pointer; outline: none; }
  .map .reg .area { stroke: var(--surface); stroke-width: 2; stroke-linejoin: round;  }
  .map .reg:hover .area { filter: brightness(.9); }
  .map .reg:focus-visible .area { stroke: var(--accent); stroke-width: 3; }
  .pop { position: absolute; z-index: 5; width: 300px; max-width: calc(100% - 8px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 10px; box-shadow: 0 8px 28px rgba(8, 20, 32, .22); font-size: 13px; }
  .pop[hidden] { display: none; }
  .pop-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 2px solid var(--ink); }
  .pop-head b { font-size: 26px; font-weight: 800; font-stretch: 68%; line-height: 1; }
  .pop-head span { color: var(--muted); }
  .pop-x { margin-left: auto; align-self: flex-start; padding: 0 7px; font-size: 18px; line-height: 24px; background: transparent; border-color: transparent; color: var(--muted); }
  .pop-x:hover { color: var(--ink); border-color: var(--line); }
  .pop-row { display: grid; grid-template-columns: 10px 96px 44px 1fr; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--soft); }
  .pop-row:last-child { border-bottom: 0; }
  .pop-row i { width: 10px; height: 10px; border-radius: 2px; display: block; }
  .pop-row .pn { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop-row .ps { text-align: right; }
  .pop-row .pd { display: flex; flex-wrap: wrap; gap: 3px; }
  .pop-row .pd b { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .pop-row.zero .pn, .pop-row.zero .ps { color: var(--muted); font-weight: 500; }
  .map .sel { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; pointer-events: none; }

</style>
</head>

<div class="wrap">
  <header>
    <h1>Luxembourg seat projector</h1>
  </header>

  <div class="layout">
    <section class="panel controls" aria-labelledby="in-h">
      <div class="panel-head">
        <h2 id="in-h">Input vote share</h2>
        <button type="button" id="reset">Reset to 2023</button>

      <div class="rows" id="rows"></div>

    <div class="results">
      <section class="panel" aria-labelledby="nat-h">

        <div class="hemi" id="hemi"></div>
        <div class="legend" id="legend"></div>

        <div class="chips" id="chips"></div>
        <div class="coal-out"><strong id="coal-n">0</strong><span id="coal-t"></span></div>
        <div class="meter" id="coal-bar" aria-hidden="true"></div>
      </section>

      <section class="panel" aria-labelledby="cons-h">
        <h2 id="cons-h">Projected results map</h2>
        <div class="map-filter" id="map-filter" role="group" aria-label="Shade the map by"></div>
        <div class="map" id="map"><div id="map-svg"></div><div class="pop" id="pop" role="dialog" hidden></div></div>
        <div class="legend" id="map-legend"></div>
      </section>

    </div>
  </div>
  <p class="credit">Data: 2023 results from <a href="https://elections.public.lu" target="_blank" rel="noopener">elections.public.lu</a>. Constituency outlines are merged canton boundaries from <a href="https://github.com/codeforgermany/click_that_hood" target="_blank" rel="noopener">click_that_hood</a>.</p>
</div>

  // English name, with the party's own label (usually an acronym) in brackets.
  function pname(p) {

  // Hagenbach-Bischoff as set out in Luxembourg's electoral law.
  function allocate(votes, seats) {

    while (sum(s) < seats) {

      steps.push({ party: best, avg: bestAvg });
    }

  }

  });

      var share = raw.map(function (v) { return v / rs * 100; });

  function hemicycle(seatsByParty) {

    $('hemi').innerHTML = hemicycle(R.seats);
    $('legend').innerHTML = PARTIES.map(function (p, i) {
      return R.seats[i] > 0 ? '<span><i style="background:' + p.color + '"></i>' + p.name + '</span>' : '';
    }).join('');

    // national table
    var rows = '';
    // A party gets its own row if it wins seats (now or in 2023) or polls at least 1%.
    PARTIES.forEach(function (p, i) {
      var show = R.seats[i] > 0 || BASE_NAT_SEATS[i] > 0 || Math.round(state.inputs[i] * 10) / 10 >= 1;
      if (!show) return;
      var d = R.seats[i] - BASE_NAT_SEATS[i];
      rows += '<tr' + (R.seats[i] === 0 ? ' class="dim"' : '') + '><td><span class="party-cell"><i style="background:' + p.color + '"></i><span>' + pname(p) + '</span></span></td>' +
        '<td>' + f1(state.inputs[i]) + '%</td>' +
        '<td class="tot">' + R.seats[i] + '</td><td>' + seatDelta(d) + '</td></tr>';
    });
    $('nat-table').innerHTML =
      '<thead><tr><th>Party</th><th>Vote</th><th>Seats</th><th>vs 2023</th></tr></thead><tbody>' + rows + '</tbody>';

    // implied national share note
    var gaps = [];
    PARTIES.forEach(function (p, i) {
      if (Math.abs(R.implied[i] - R.norm[i]) > 0.15) gaps.push(p.name + ' ' + f1(R.implied[i]) + '% against ' + f1(R.norm[i]) + '% entered');
    });
    $('implied').textContent = gaps.length ? 'Constituency adjustments mean the implied national share differs from your input: ' + gaps.join('; ') + '.' : '';

    // coalition
    renderCoalition(R);

    // map + selected constituency
    renderMap(R);
    renderMapLegend(R);
    updateFilter();
    renderPop(R);
  }

  function winnerOf(C) {
    var win = 0;
    PARTIES.forEach(function (p, i) {
      if (C.seats[i] > C.seats[win] || (C.seats[i] === C.seats[win] && C.share[i] > C.share[win])) win = i;
    });
    return win;
  }

  // In party mode the map is shaded by that party's vote share, scaled from 0 to its best constituency.
  function maxShare(R, pi) {
    return Math.max.apply(null, CONS.map(function (c, ci) { return CONS[ci].votes[pi] > 0 ? R.cons[ci].share[pi] : 0; }));
  }

  function renderMap(R) {
    var mode = state.mapMode, party = mode === 'win' ? null : mode;
    var mx = party === null ? 0 : maxShare(R, party);
    var svg = '<svg viewBox="0 0 ' + MAP.w + ' ' + MAP.h + '" role="group" aria-label="Projected results by constituency">';
    var selPath = '';
    CONS.forEach(function (c, ci) {
      var C = R.cons[ci], reg = MAP.regions[c.id];
      var desc = PARTIES.map(function (p, i) { return C.seats[i] ? p.name + ' ' + C.seats[i] : ''; }).filter(Boolean).join(', ');
      var fill, op = 1, extra = '';
      if (party === null) {
        fill = PARTIES[winnerOf(C)].color;
      } else if (c.votes[party] > 0) {
        fill = PARTIES[party].color;
        op = mx > 0 ? 0.15 + 0.85 * C.share[party] / mx : 1;
        extra = '; ' + PARTIES[party].name + ' ' + f1(C.share[party]) + '% of the vote';
      } else {
        fill = null;
        extra = '; ' + PARTIES[party].name + ' not standing';
      }
      var on = c.id === state.sel;
      if (on) selPath = reg.path;
      svg += '<g class="reg" data-id="' + c.id + '" tabindex="0" role="button" aria-pressed="' + on + '" aria-label="' + c.id + ', ' + c.seats + ' seats: ' + desc + extra + '">' +
        '<path class="area" d="' + reg.path + '" ' + (fill ? 'fill="' + fill + '" fill-opacity="' + op.toFixed(3) + '"' : 'style="fill:var(--soft)"') + '/>' +
        '</g>';
    });
    svg += '<path class="sel" d="' + selPath + '"/></svg>';
    $('map-svg').innerHTML = svg;
  }

  function renderMapLegend(R) {
    var el = $('map-legend');
    if (state.mapMode === 'win') {
      var winners = {};
      CONS.forEach(function (c, ci) { winners[winnerOf(R.cons[ci])] = true; });
      el.innerHTML = PARTIES.map(function (p, i) {
        return winners[i] ? '<span><i style="background:' + p.color + '"></i>' + p.name + '</span>' : '';
      }).join('');
      return;
    }
    var pi = state.mapMode, p = PARTIES[pi], mx = maxShare(R, pi);
    var missing = CONS.some(function (c) { return c.votes[pi] === 0; });
    el.innerHTML = '<span>' + p.name + ' vote share</span><span>0%</span><i class="gbar" style="--c:' + p.color + '"></i><span>' + f1(mx) + '%</span>' +
      (missing ? '<span class="nos"><i></i>Not standing</span>' : '');
  }

  // Filter chips: winning party, or shade by one party's vote share.
  function buildFilter() {
    var order = PARTIES.map(function (p, i) { return i; }).sort(function (x, y) { return BASE_NAT[y] - BASE_NAT[x]; });
    var html = '<span class="lbl">Shade by</span><button type="button" class="chip" data-mode="win"><i style="background:conic-gradient(' +
      PARTIES[0].color + ' 0 34%,' + PARTIES[1].color + ' 0 67%,' + PARTIES[2].color + ' 0)"></i>Winning party</button>';
    order.forEach(function (i) {
      html += '<button type="button" class="chip" data-mode="' + i + '"><i style="background:' + PARTIES[i].color + '"></i>' + PARTIES[i].name + '</button>';
    });
    $('map-filter').innerHTML = html;
  }
  function updateFilter() {
    [].forEach.call(document.querySelectorAll('#map-filter .chip'), function (b) {
      var m = b.getAttribute('data-mode');
      b.setAttribute('aria-pressed', String(m === String(state.mapMode)));
    });
  }
  $('map-filter').addEventListener('click', function (e) {
    var b = e.target.closest('button.chip');
    if (!b) return;
    var m = b.getAttribute('data-mode');
    state.mapMode = m === 'win' ? 'win' : parseInt(m, 10);
    render();
  });

  // Popup for the selected constituency: vote share per party, one circle per seat.
  function renderPop(R) {
    var pop = $('pop');
    var ci = CONS.map(function (c) { return c.id; }).indexOf(state.sel);
    if (ci < 0) { pop.hidden = true; return; }
    var c = CONS[ci], C = R.cons[ci];
    var order = PARTIES.map(function (p, i) { return i; }).filter(function (i) { return c.votes[i] > 0; })
      .sort(function (a, b) { return C.seats[b] - C.seats[a] || C.share[b] - C.share[a]; });
    var rows = order.map(function (i) {
      var dots = '';
      for (var k = 0; k < C.seats[i]; k++) dots += '<b style="background:' + PARTIES[i].color + '"></b>';
      return '<div class="pop-row' + (C.seats[i] ? '' : ' zero') + (state.mapMode === i ? ' focus' : '') + '"><i style="background:' + PARTIES[i].color + '"></i>' +
        '<span class="pn">' + PARTIES[i].name + '</span><span class="ps">' + f1(C.share[i]) + '%</span>' +
        '<span class="pd" aria-label="' + C.seats[i] + ' seats">' + dots + '</span></div>';
    }).join('');
    pop.setAttribute('aria-label', c.id + ' constituency');
    pop.innerHTML = '<div class="pop-head"><b>' + c.id + '</b><span>' + c.seats + ' seats</span>' +
      '<button type="button" class="pop-x" aria-label="Close">\u00d7</button></div>' + rows;
    pop.hidden = false;
    var box = $('map'), W = box.clientWidth, H = box.clientHeight;
    var pw = pop.offsetWidth, ph = pop.offsetHeight, at = state.popAt || { x: W / 2, y: H / 2 };
    var left = Math.max(4, Math.min(at.x - pw / 2, W - pw - 4));
    var top = at.y + 14;
    if (top + ph > H - 4) top = Math.max(4, at.y - ph - 14);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function renderCoalition(R) {
    var chips = '';
    PARTIES.forEach(function (p, i) {
      if (R.seats[i] > 0) {
        var on = !!state.coalition[p.id];
        chips += '<button type="button" class="chip" data-id="' + p.id + '" aria-pressed="' + on + '"><i style="background:' + p.color + '"></i>' + p.name + ' <span>' + R.seats[i] + '</span></button>';
      }
    });
    $('chips').innerHTML = chips;
    var n = 0, names = [];
    PARTIES.forEach(function (p, i) { if (state.coalition[p.id] && R.seats[i] > 0) { n += R.seats[i]; names.push(p.name); } });
    $('coal-n').textContent = n;
    $('coal-t').textContent = names.length ? (n >= 31 ? 'seats: majority of ' + (n - 30) + ' (' + names.join(' + ') + ')' : 'seats: ' + (31 - n) + ' short of a majority (' + names.join(' + ') + ')') : 'Select parties to test a coalition.';
    var segs = '';
    PARTIES.forEach(function (p, i) {
      if (state.coalition[p.id] && R.seats[i] > 0) segs += '<b style="width:' + (R.seats[i] / 60 * 100) + '%;background:' + p.color + '"></b>';
    });
    $('coal-bar').innerHTML = segs + '<u></u>';
  }

  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button.chip');
    if (!b) return;
    var id = b.getAttribute('data-id');
    state.coalition[id] = !state.coalition[id];
    render();
    var again = document.querySelector('.chip[data-id="' + id + '"]');
    if (again) again.focus();
  });

  function openRegion(g, x, y) {
    var id = g.getAttribute('data-id');
    var svgEl = $('map-svg').firstChild;
    if (x == null) {
      var reg = MAP.regions[id];
      x = reg.label[0] / MAP.w * (svgEl ? svgEl.clientWidth : 0);
      y = reg.label[1] / MAP.h * (svgEl ? svgEl.clientHeight : 0);
    }
    state.sel = id;
    state.popAt = { x: x, y: y };
    render();
  }
  function closePop(refocus) {
    var id = state.sel;
    state.sel = null;
    render();
    if (refocus && id) { var g = document.querySelector('.reg[data-id="' + id + '"]'); if (g) g.focus(); }
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    if (t.closest('.pop-x')) { closePop(true); return; }
    var g = t.closest('.reg');
    if (g && $('map').contains(g)) {
      var r = $('map').getBoundingClientRect();
      openRegion(g, e.clientX - r.left, e.clientY - r.top);
      return;
    }
    if (t.closest('#pop') || t.closest('.controls') || t.closest('.map-filter')) return;
    if (state.sel) closePop(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.sel) { closePop(true); return; }
    var g = e.target.closest && e.target.closest('.reg');
    if (g && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openRegion(g);
      var again = document.querySelector('.reg[data-id="' + g.getAttribute('data-id') + '"]');
      if (again) again.focus();
    }
  });

  $('reset').addEventListener('click', function () { state.inputs = BASE_NAT.slice(); syncInputs(); render(); });
  $('scale').addEventListener('click', function () {
    var t = sum(state.inputs);
    if (t > 0) state.inputs = state.inputs.map(function (v) { return v / t * 100; });
    syncInputs(); render();
  });

  buildInputs();
  buildFilter();
  syncInputs();
  render();

  // Exposed for checking in the console
  window.__lux = { project: project, allocate: allocate, BASE_NAT: BASE_NAT };
})();
</script>
