<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Lanka seat projector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#101828; --muted:#566274; --line:#D3DAE2; --focus:#1F4E8C;
  --warn-bg:#FFF1E0; --warn-ink:#7A3E00; --ok:#1B7A46; --neg:#B3261E; --seat-stroke:#FFFFFF;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --panel:#161D25; --panel2:#1B242E; --ink:#E9EEF3; --muted:#9AA6B4; --line:#2B3744; --focus:#7FB0F0;
    --warn-bg:#3A2A12; --warn-ink:#F2C98F; --ok:#5CCB8B; --neg:#FF8A80; --seat-stroke:#161D25;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --panel:#161D25; --panel2:#1B242E; --ink:#E9EEF3; --muted:#9AA6B4; --line:#2B3744; --focus:#7FB0F0;
  --warn-bg:#3A2A12; --warn-ink:#F2C98F; --ok:#5CCB8B; --neg:#FF8A80; --seat-stroke:#161D25;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px}
header.top{padding:10px 0 18px}
h1{font-size:clamp(1.8rem,4.4vw,2.9rem);line-height:1.02;font-weight:700;margin:0 0 8px;letter-spacing:-.02em;font-variation-settings:'opsz' 72}
.lede{margin:0;max-width:64ch;color:var(--muted);font-size:1.02rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.ballot{padding:14px 16px 12px}
.ballot h2,.sec h2{font-size:1.35rem;margin:0 0 12px;font-weight:700;letter-spacing:-.01em;text-align:center}
.sec h2+.mininote,.ballot h2+.mininote{text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:.86rem;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;grid-template-columns:14px 265px minmax(0,1fr) 84px;gap:0 10px;align-items:center;padding:3px 0}
.chip{width:14px;height:14px;border-radius:4px;grid-row:1}
.row .nm{font-weight:650;line-height:1.15;font-size:.93rem}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.numwrap{position:relative}
.numwrap input{width:100%;padding:4px 22px 4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel2);text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.numwrap::after{content:'%';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
input[type=range]{--c:var(--ink);-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer}
.row .chip{grid-column:1;grid-row:1}
.row .nm{grid-column:2;grid-row:1}
.row input[type=range]{grid-column:3;grid-row:1;width:100%;margin:0}
.row .numwrap{grid-column:4;grid-row:1}
@media (max-width:760px){.row{grid-template-columns:14px 1fr 84px;padding:6px 0}.row .nm{grid-column:2;grid-row:1}.row .numwrap{grid-column:3;grid-row:1}.row input[type=range]{grid-column:2 / 4;grid-row:2;margin-top:2px}}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--c) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--c)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--c)}
.row .sw{grid-column:2 / 4;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grp{margin:16px 0 4px;font-size:.8rem;color:var(--muted);font-weight:650}
.others{display:flex;justify-content:space-between;align-items:baseline;padding:6px 12px;margin-top:8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.others b{font-size:1.1rem}
.alert{margin:12px 0 0;padding:10px 12px;border-radius:9px;background:var(--warn-bg);color:var(--warn-ink);font-size:.88rem}
.modes{display:flex;gap:6px;margin:0 0 4px}
.mininote{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.results{display:grid;gap:18px;min-width:0}
.sec{padding:18px}
.stale{opacity:.45;pointer-events:none}
.headline{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:flex-end;margin:0 0 6px}
.big{font-size:clamp(3rem,9vw,5.2rem);line-height:.9;font-weight:760;letter-spacing:-.04em;font-variant-numeric:tabular-nums;font-variation-settings:'opsz' 96}
.verdict{font-size:1.05rem;max-width:44ch}
.verdict b{font-weight:700}
.thr{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.cchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:650;font-size:.9rem}
.cchip i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--c)}
.cchip b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.cchip[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.cchip[aria-pressed="true"] b{color:var(--ink)}
.cbar{position:relative;height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);margin:22px 0 0;overflow:visible}
.cfill{position:absolute;inset:0;display:flex;border-radius:8px;overflow:hidden}
.cseg{height:100%;width:0;flex:none}
.cmark{position:absolute;top:-8px;bottom:-8px;width:0;border-left:2px dashed var(--ink)}
.cmark span{position:absolute;top:-16px;left:0;transform:translateX(-50%);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.csum{margin-top:12px;font-size:1.02rem}
.csum b{font-weight:760}
@media (prefers-reduced-motion:no-preference){.cseg{transition:width .45s cubic-bezier(.2,.8,.2,1)}}
.mapctl{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.mapctl .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:.84rem}
.mapctl .btn i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grad{height:10px;border-radius:99px;width:min(260px,70%);border:1px solid var(--line)}
.gradrow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:.85rem;font-variant-numeric:tabular-nums;width:100%}
.strong{width:100%;text-align:center;font-size:.88rem;color:var(--muted);margin-top:2px}
.strong b{color:var(--ink);font-weight:650}
.lnk{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--ink)}
.mapwrap{position:relative}
.pop{position:absolute;z-index:6;width:min(310px,calc(100% - 8px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px 9px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.pop[hidden]{display:none}
.pop,.pop *{max-height:none}
.pop{overflow:visible}
.pop h3{margin:0 24px 1px 0;font-size:.95rem;font-weight:700}
.pop .sub{color:var(--muted);font-size:.76rem;margin:0 0 5px}
.pop .x{position:absolute;top:6px;right:8px;border:0;background:transparent;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.pop .pn{display:flex;align-items:center;line-height:1.15;font-size:.78rem}
.pop .pr{display:grid;grid-template-columns:112px 42px minmax(0,1fr);gap:3px 6px;align-items:center;padding:2px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:.8rem}
.pop .pr:first-of-type{border-top:0}
.pop .pr b{font-weight:700}
.pop .pr .pc{text-align:right}
.pop .sqs{display:flex;flex-wrap:wrap;gap:2px}
.pop .sqs i{width:9px;height:9px;border-radius:2px;display:inline-block}
.pop .pr .none{color:var(--muted)}
.map path{cursor:pointer;outline:none}
.map path.sel{stroke:var(--ink);stroke-width:1.8}
.map path:focus-visible{stroke:var(--focus);stroke-width:2}
svg.map{max-width:340px;height:auto;display:block;margin:4px auto 0}
.map path{stroke:var(--panel);stroke-width:.7;stroke-linejoin:round}
.mapkey{justify-content:center;margin-top:12px}
svg.hemi{width:100%;max-width:600px;height:auto;display:block;margin:0 auto}
.hemi circle{stroke:var(--seat-stroke);stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 0;font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-top:1px solid var(--line);font-size:.93rem}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:600;font-size:.82rem}
td.tot{font-weight:750}
.pos{color:var(--ok)} .neg{color:var(--neg)}
.scroll{overflow-x:auto}
details.d{border-top:1px solid var(--line)}
details.d:first-of-type{border-top:0}
details.d>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(120px,1.1fr) 40px minmax(110px,1.4fr) minmax(0,1.5fr);gap:6px 12px;align-items:center;padding:10px 4px}
details.d>summary::-webkit-details-marker{display:none}
details.d>summary:hover{background:var(--panel2)}
.dn{font-weight:650}
.dn small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.ds{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.sq{display:flex;flex-wrap:wrap;gap:2px}
.sq i{width:11px;height:14px;border-radius:2px;display:inline-block}
.dsh{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:620px){details.d>summary{grid-template-columns:1fr 36px;} .dsh,.sqc{grid-column:1 / 3}}
.dd{padding:2px 4px 14px}
.dd .meta{font-size:.84rem;color:var(--muted);margin:2px 0 8px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:.75rem;font-weight:650;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)} .tag.no{color:var(--muted)}
.method p,.method li{max-width:78ch;color:var(--ink)}
.method ul{padding-left:1.1rem}
.method h3{font-size:.98rem;margin:16px 0 4px}
.badge{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:.86rem;background:var(--panel)}
.badge b{color:var(--ok)}
@media (prefers-reduced-motion:no-preference){ .big{transition:color .2s} }
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>Sri Lanka seat projector</h1>
  </header>

  <div class="layout">
    <aside class="card ballot" aria-label="Vote shares">
      <h2>Input vote share</h2>
      <div id="inputs"></div>
      <div class="others"><span>Other</span><b id="othersVal">8.2%</b></div>

        <button class="btn" data-preset="2024">Reset to 2024 result</button>

    <div class="results" id="results">
      <section class="card sec" aria-live="polite">
        <h2>Projected election result</h2>
        <svg class="hemi" id="hemi" viewBox="-322 -322 644 340" role="img" aria-label="Parliament seat chart"></svg>
        <div class="legend" id="legend"></div>
        <div class="scroll" style="margin-top:16px"><table id="totals"></table></div>
        <p class="mininote" id="capNote"></p>

        <div class="csum" id="csum" aria-live="polite"></div>

        <h2>Projected results map</h2>
        <div class="mapctl" id="mapBtns" role="group" aria-label="Map view"></div>
        <div class="mapwrap" id="mapwrap"><svg class="map" id="map" viewBox="0 0 298.8 527.3" role="group" aria-label="Map of Sri Lanka showing the leading party in each electoral district. Select a district for its result."></svg>
        <div class="pop" id="pop" role="dialog" aria-label="District result" hidden></div></div>
        <div class="legend mapkey" id="mapkey"></div>
      </section>
    </div>
  </div>
</div>

  v:{NPP:275180,SJB:102958,NDF:36450,SLPP:11255},ents:[['UDV',9656],['UNA',8851],['IND',6886],['SB',4645],['DLF',3967]]},
 {id:'monaragala',name:'Monaragala',prov:'Uva',seats:6,valid:271856,ig:4468,
  v:{NPP:174730,SJB:62014,NDF:10697,SLPP:11624},ents:[['SB',3455],['IND',3043],['DLF',1569]]},
 {id:'ratnapura',name:'Ratnapura',prov:'Sabaragamuwa',seats:11,valid:596370,ig:13157,
  v:{NPP:368229,SJB:133041,NDF:26171,SLPP:29316},ents:[['SB',10485],['DLF',5067]]},
 {id:'kegalle',name:'Kegalle',prov:'Sabaragamuwa',seats:9,valid:482151,ig:5768,
  v:{NPP:312441,SJB:109691,NDF:26309,SLPP:12373},ents:[['SB',7602]]},

const TOTAL_VALID = 11148006;
const NATIONAL_SEATS = 29;
// Official all-island totals (used for the national list). Named parties first, then other parties that could contest a remainder seat.
const NAMED = ['NPP','SJB','NDF','SLPP','ITAK','SLMC','ACMC','ACTC','DTNA','UNP'];
const OFFICIAL_NATIONAL = {NPP:6863186,SJB:1968716,NDF:500835,SLPP:350429,ITAK:257813,SLMC:87038,ACMC:33911,ACTC:39894,DTNA:65382,UNP:66234};
const OTHER_NATIONAL = {SB:178006,UDV:83488,DLF:50836,DNA:45419,TMVP:34440,PSA:29611,EPDP:28985,IG17:27855,NDFo:25444,UNA:22548,SLLP:17710};

// ===== ENGINE =====
function modeledBase(){ // modelled national baseline of each named party (sum of district votes)
  const m={}; NAMED.forEach(p=>m[p]=0);
  DISTRICTS.forEach(d=>{for(const p in d.v) m[p]+=d.v[p];});
  return m;
}
const MODELED = modeledBase();

// Solve for the swing that makes the party's modelled national vote equal its target, applied only where it stood in 2024.
function calibrate(party, targetVotes, mode){
  // Additive swing: every party is assumed to contest every district. Proportional swing can only scale an existing vote.
  const ds = mode==='prop' ? DISTRICTS.filter(d=>d.v[party]>0) : DISTRICTS;
  if(!ds.length) return {mode:'prop',k:0,share:()=>0};
  if(mode==='prop'){
    const base = ds.reduce((a,d)=>a+d.v[party],0);
    const k = targetVotes/base;
    return {mode:'prop',k, share:(d)=> Math.min(1,(d.v[party]/d.valid)*k)};
  }
  const f = c => ds.reduce((a,d)=>a+d.valid*Math.min(1,Math.max(0,(d.v[party]||0)/d.valid+c)),0);
  let lo=-1, hi=1;
  if(targetVotes<=f(lo)) return {mode:'add',c:lo, share:d=>Math.min(1,Math.max(0,(d.v[party]||0)/d.valid+lo))};
  if(targetVotes>=f(hi)) return {mode:'add',c:hi, share:d=>Math.min(1,Math.max(0,(d.v[party]||0)/d.valid+hi))};
  for(let i=0;i<200;i++){const mid=(lo+hi)/2; if(f(mid)<targetVotes) lo=mid; else hi=mid;}
  const c=(lo+hi)/2;
  return {mode:'add',c, share:d=>Math.min(1,Math.max(0,(d.v[party]||0)/d.valid+c))};
}

// shares: national share (0..1 of all valid votes, all-island basis) per named party
function project(shares, mode){
  mode = mode||'add';
  const cal={};
  NAMED.forEach(p=>{
    const t = (shares[p]||0)*TOTAL_VALID * (MODELED[p]/OFFICIAL_NATIONAL[p]); // convert to modelled basis
    cal[p]=calibrate(p,t,mode);
  });
  const dres=[]; let newOthersTotal=0, oldOthersTotal=0;
  const natVotes={}; NAMED.forEach(p=>natVotes[p]=0);
  DISTRICTS.forEach(d=>{
    const namedBase = Object.values(d.v).reduce((a,b)=>a+b,0);
    const entsBase = d.ents.reduce((a,e)=>a+e[1],0);
    const othersBase = d.valid-namedBase;           // everything that is not a modelled named party
    let sh={}; let S=0;
    NAMED.forEach(p=>{ const x=cal[p].share(d); if(x*d.valid>=0.5){ sh[p]=x; S+=x; } });
    let scale=1, othersShare=1-S;
    if(S>1){scale=1/S; othersShare=0;}
    const ents=[]; // {key,label,votes,pool}
    NAMED.forEach(p=>{ if(sh[p]>0) ents.push({key:p,votes:sh[p]*scale*d.valid}); });
    const oShareVotes = othersShare*d.valid;
    d.ents.forEach(e=>{ ents.push({key:e[0],votes:oShareVotes*(e[1]/othersBase)}); });
    const restBase = othersBase-entsBase;
    ents.push({key:'REST',votes:oShareVotes*(restBase/othersBase),pool:true});
    ents.forEach(e=>{ if(NAMED.includes(e.key)) natVotes[e.key]+=e.votes; });
    newOthersTotal+=oShareVotes; oldOthersTotal+=othersBase;
    const dr=allocateDistrict(d,ents); dr.igVotes=(d.ig!==undefined&&othersBase>0)?d.ig*(oShareVotes/othersBase):null; dres.push(dr);
  });
  const F = newOthersTotal/oldOthersTotal;
  const nl = allocateNational(natVotes,F);
  // totals
  const totals={};
  dres.forEach(r=>{for(const k in r.seats) totals[k]=(totals[k]||0)+r.seats[k];});
  const districtTotals={...totals};
  for(const k in nl.seats) totals[k]=(totals[k]||0)+nl.seats[k];
  return {districts:dres,national:nl,totals,districtTotals,natVotes,cal,F};
}

function allocateDistrict(d,ents){
  const thresh=d.valid/20;
  const real = ents.filter(e=>!e.pool && e.votes>0);
  let qual = real.filter(e=>e.votes>=thresh-1e-9);
  if(!qual.length && real.length){ qual=[real.reduce((a,b)=>b.votes>a.votes?b:a)]; } // degenerate: nobody reaches 5%
  const isQ = e => qual.some(q=>q.key===e.key);
  const seats={}; qual.forEach(e=>seats[e.key]=0);
  const detail=[];
  // bonus seat
  let bonusKey=null;
  if(real.length){ let top=real.reduce((a,b)=>b.votes>a.votes?b:a); bonusKey=top.key; if(!(bonusKey in seats)) seats[bonusKey]=0; seats[bonusKey]+=1; }
  const rem = d.seats-1;
  const qv = qual.reduce((a,e)=>a+e.votes,0);
  const quota = qv/rem;
  const rows = qual.map(e=>({key:e.key,votes:e.votes,whole:Math.floor(e.votes/quota+1e-12),frac:(e.votes/quota)-Math.floor(e.votes/quota+1e-12)}));
  let assigned = rows.reduce((a,r)=>a+r.whole,0);
  rows.forEach(r=>{seats[r.key]=(seats[r.key]||0)+r.whole; r.rem=0;});
  let left = rem-assigned;
  const order = rows.slice().sort((a,b)=>b.frac-a.frac || b.votes-a.votes);
  for(let i=0;i<left && i<order.length;i++){ seats[order[i].key]+=1; order[i].rem=1; }
  const out = {id:d.id,name:d.name,prov:d.prov,seatsTotal:d.seats,valid:d.valid,thresh,quota,bonus:bonusKey,
    rows:ents.filter(e=>!e.pool&&e.votes>0).map(e=>{const r=rows.find(x=>x.key===e.key&&isQ(e)); return {key:e.key,votes:e.votes,share:e.votes/d.valid,qualified:isQ(e),bonus:e.key===bonusKey,whole:r?r.whole:0,rem:r?r.rem:0,seats:seats[e.key]||0};}).sort((a,b)=>b.votes-a.votes),
    poolVotes:(ents.find(e=>e.pool)||{votes:0}).votes, seats};
  return out;
}

function allocateNational(natVotes,F){
  const parties={};
  NAMED.forEach(p=>{ parties[p]=natVotes[p]*(OFFICIAL_NATIONAL[p]/MODELED[p]); });
  for(const k in OTHER_NATIONAL) parties[k]=OTHER_NATIONAL[k]*F;
  const quota = TOTAL_VALID/NATIONAL_SEATS;
  const rows=Object.keys(parties).filter(k=>parties[k]>0).map(k=>({key:k,votes:parties[k],whole:Math.floor(parties[k]/quota+1e-12),frac:parties[k]/quota-Math.floor(parties[k]/quota+1e-12)}));
  const seats={}; let assigned=0;
  rows.forEach(r=>{seats[r.key]=r.whole; assigned+=r.whole; r.rem=0;});
  let left=NATIONAL_SEATS-assigned;
  const order=rows.slice().sort((a,b)=>b.frac-a.frac||b.votes-a.votes);
  for(let i=0;i<left;i++){ if(i<order.length){ seats[order[i].key]+=1; order[i].rem=1; } else { seats.OTH=(seats.OTH||0)+1; } } // listed parties exhausted: leftover seats go to the unlisted tail
  Object.keys(seats).forEach(k=>{if(!seats[k]) delete seats[k];});
  return {quota,rows:rows.sort((a,b)=>b.votes-a.votes),seats};
}

function baselineShares(){const s={};NAMED.forEach(p=>s[p]=OFFICIAL_NATIONAL[p]/TOTAL_VALID);return s;}
if(typeof module!=='undefined') module.exports={DISTRICTS,NAMED,OFFICIAL_NATIONAL,TOTAL_VALID,project,baselineShares,MODELED};

</script>
<script>
(function(){

 NPP:{n:"National People's Power",c:'#C8372D'},
 SJB:{n:'Samagi Jana Balawegaya',c:'#2F8F5B'},
 NDF:{n:'New Democratic Front',c:'#3D7EC9'},
 SLPP:{n:'Sri Lanka Podujana Peramuna',c:'#8A2F63'},
 ITAK:{n:'Ilankai Tamil Arasu Kachchi',c:'#E3A21A'},
 SLMC:{n:'Sri Lanka Muslim Congress',c:'#12877F'},

 ACTC:{n:'All Ceylon Tamil Congress',c:'#E26A2C'},

 SB:{n:'Sarvajana Balaya',c:'#D6457F'},UDV:{n:'United Democratic Voice',c:'#2BB3D6'},DLF:{n:'Democratic Left Front',c:'#3F4F8F'},DNA:{n:'Democratic National Alliance',c:'#4FC3A1'},
 TMVP:{n:'Tamil Makkal Viduthalai Pulikal',c:'#A8873A'},EPDP:{n:"Eelam People's Democratic Party",c:'#FF7F6B'},IG17:{n:'Jaffna Independent Group 17',c:'#B0B0B0'},
 SLLP:{n:'Sri Lanka Labour Party',c:'#9A5BB5'},TMK:{n:'Thamizh Makkal Koottani',c:'#7FB069'},PSA:{n:"People's Struggle Alliance",c:'#E2C044'},NDFo:{n:'National Democratic Front',c:'#8D99AE'},
 UNA:{n:'United National Alliance',c:'#A3C4BC'},IND:{n:'Independent groups',c:'#B0B0B0'},NFGG:{n:'National Front for Good Governance',c:'#C9A227'},OTH:{n:'Unlisted small parties',c:'#6E7681'},
};

 {t:'Main parties',keys:['NPP','SJB','NDF','SLPP']},
 {t:'Regional parties',keys:['ITAK','SLMC','ACMC','ACTC','DTNA','UNP']},
];

const ORDER=['NPP','SJB','NDF','UNP','SLPP','SLMC','ACMC','ITAK','ACTC','DTNA'];

const base=baselineShares();             // fractions
let state={};                            // percentages
NAMED.forEach(p=>state[p]=base[p]*100);
const mode='add'; // uniform national swing
const baseRes=project(base,'add');

const PRESETS={'2024':{}};

// ---------- inputs ----------
const inputsEl=document.getElementById('inputs');
function buildInputs(){
  let h='';
  [...NAMED].sort((x,y)=>OFFICIAL_NATIONAL[y]-OFFICIAL_NATIONAL[x]).forEach(k=>{{
      const r=RANGE[k];

        <input type="range" id="r_${k}" min="${r[0]}" max="${r[1]}" step="${r[2]}" aria-label="${k} vote share">
      </div>`;
    }

    r.addEventListener('input',()=>{ let x=parseFloat(r.value); const cap=room(k); if(x>cap){x=cap; r.value=Math.min(cap,+r.max);} state[k]=x; n.value=fmtIn(x); setP(r); update(); });
  });
  syncInputs();
}
const room=k=>Math.max(0,100-NAMED.reduce((a,p)=>a+(p===k?0:(state[p]||0)),0));
function setP(r){r.style.setProperty('--p',(100*(r.value-r.min)/(r.max-r.min))+'%');}
const fmtIn=v=>v.toFixed(1);
function syncInputs(){
  NAMED.forEach(k=>{
    const n=document.getElementById('n_'+k), r=document.getElementById('r_'+k);
    n.value=fmtIn(state[k]); r.value=Math.min(state[k],+r.max); setP(r);
  });
}

// ---------- hemicycle ----------
function seatLayout(total){
  const rows=9,rIn=105,rOut=300,radii=[];
  for(let i=0;i<rows;i++) radii.push(rIn+(rOut-rIn)*i/(rows-1));
  const sR=radii.reduce((a,b)=>a+b,0);
  const counts=radii.map(r=>Math.round(total*r/sR));
  let diff=total-counts.reduce((a,b)=>a+b,0), i=rows-1;
  while(diff!==0){counts[i]+=Math.sign(diff);diff-=Math.sign(diff);i=(i-1+rows)%rows;}
  const seats=[];
  counts.forEach((n,ri)=>{for(let k=0;k<n;k++){seats.push({a:Math.PI*(1-k/(n-1)),r:radii[ri]});}});
  seats.sort((x,y)=>y.a-x.a||x.r-y.r);
  return seats;
}
const LAYOUT=seatLayout(225);

function seatSequence(totals){
  const named=ORDER.filter(k=>totals[k]);
  const rest=Object.keys(totals).filter(k=>!ORDER.includes(k)&&totals[k]).sort((a,b)=>totals[b]-totals[a]);
  const seq=[];
  named.concat(rest).forEach(k=>{for(let i=0;i<totals[k];i++)seq.push(k);});
  return seq;
}
function drawHemi(totals){
  const seq=seatSequence(totals);
  let s='';
  LAYOUT.forEach((p,i)=>{
    const k=seq[i]||null;
    s+=`<circle cx="${(p.r*Math.cos(p.a)).toFixed(1)}" cy="${(-p.r*Math.sin(p.a)).toFixed(1)}" r="10.2" fill="${k?col(k):'transparent'}"/>`;
  });
  document.getElementById('hemi').innerHTML=s;
}

// ---------- rendering ----------
const fmt=n=>n.toLocaleString('en-GB',{maximumFractionDigits:0});
const pc=(x,d=1)=>(x*100).toFixed(d)+'%';
const BASE_TOT=baseRes.totals;

function groupTotals(res){
  const t=res.totals, g={};
  for(const k in t){ g[k]=t[k]; }
  return g;
}
function seatChips(seats){
  const keys=Object.keys(seats).filter(k=>seats[k]>0).sort((a,b)=>seats[b]-seats[a]);
  let h='';
  keys.forEach(k=>{for(let i=0;i<seats[k];i++)h+=`<i style="background:${col(k)}" title="${k}"></i>`;});
  return h;
}
const mergeIG=t=>{const o={...t};if(o.IG17){o.IND=(o.IND||0)+o.IG17;delete o.IG17;}return o;};
const lab=k=>k==='IND'?'Independents':k==='NDFo'?'JPF':k==='OTH'?'Unlisted parties':k;
function render(res,shares){
  const tot=mergeIG(res.totals);
  const arr=Object.keys(tot).filter(k=>tot[k]>0).sort((a,b)=>tot[b]-tot[a]);
  const lead=arr[0];
  drawHemi(tot);
  renderBuilder(tot,arr,lead);
  // legend
  const named=ORDER.filter(k=>tot[k]);
  const otherKeys=arr.filter(k=>!ORDER.includes(k));
  let lg=named.concat(otherKeys).map(k=>`<span><i style="background:${col(k)}"></i>${lab(k)} ${tot[k]}</span>`).join('');
  document.getElementById('legend').innerHTML=lg;
  // totals table
  const ach={}; NAMED.forEach(p=>ach[p]=res.natVotes[p]*(OFFICIAL_NATIONAL[p]/MODELED[p])/TOTAL_VALID);
  const othersAch=1-NAMED.reduce((a,p)=>a+ach[p],0);
  const distVotes={}; res.districts.forEach(dr=>dr.rows.forEach(x=>{distVotes[x.key]=(distVotes[x.key]||0)+x.votes;}));
  const IGK=['IND','IG17'];
  const sumK=(obj,ks)=>ks.reduce((a,k)=>a+(obj[k]||0),0);
  const candKeys=[...new Set([...NAMED,...Object.keys(tot),...Object.keys(OTHER_NATIONAL),...Object.keys(distVotes)])].filter(k=>!IGK.includes(k)&&k!=='OTH');
  const items=[];
  candKeys.forEach(k=>{
    const vs=NAMED.includes(k)?ach[k]:((OTHER_NATIONAL[k]!==undefined)?OTHER_NATIONAL[k]*res.F/TOTAL_VALID:(distVotes[k]||0)/TOTAL_VALID);
    const t=tot[k]||0;
    if(vs>=0.01||t>0) items.push({k,vs,t,d:res.districtTotals[k]||0,n:res.national.seats[k]||0,b:BASE_TOT[k]||0,label:`${nm(k)} (${k})`,color:col(k)});
  });
  {
    const igVs=res.districts.reduce((a,r)=>a+(r.igVotes!=null?r.igVotes:0),0)/TOTAL_VALID;
    const t=sumK(tot,IGK);
    if(igVs>=0.01||t>0) items.push({k:'IND',vs:igVs,t,d:sumK(res.districtTotals,IGK),n:0,b:sumK(BASE_TOT,IGK),label:'Independents',color:col('IND')});
  }
  const othT=tot.OTH||0;
  if(othT>0) items.push({k:'OTH',vs:0,t:othT,d:res.districtTotals.OTH||0,n:res.national.seats.OTH||0,b:0,label:'Unlisted small parties',color:col('OTH')});
  // always descending by total seats; ties broken by vote share
  items.sort((a,b)=>b.t-a.t||b.vs-a.vs);

    const df=x.t-x.b;

  });
  document.getElementById('totals').innerHTML=`<thead><tr><th>Party</th><th>Vote</th><th>District</th><th>National List</th><th>Total</th><th>vs 2024</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td><b>Total</b></td><td></td><td><b>${Object.values(res.districtTotals).reduce((a,b)=>a+b,0)}</b></td><td><b>${Object.values(res.national.seats).reduce((a,b)=>a+b,0)}</b></td><td class="tot">${Object.values(tot).reduce((a,b)=>a+b,0)}</td><td></td></tr></tfoot>`;

  // capped notes
  const diffs=NAMED.filter(p=>Math.abs(ach[p]-shares[p])>0.0005&&(shares[p]>0.0005));

    ? 'The model could not reach the entered share for '+diffs.map(p=>`${p} (${pc(shares[p],2)} entered, ${pc(ach[p],2)} reached)`).join(', ')+'. This happens where the entered shares would add up to more than 100% in a district, so they are scaled down together.'
    : 'Vote shares shown are the national shares the projection actually produces.';

const mapEl=document.getElementById('map'), popEl=document.getElementById('pop'), wrapEl=document.getElementById('mapwrap');
mapEl.innerHTML=Object.keys(MAP_PATHS).map(id=>`<path data-id="${id}" d="${MAP_PATHS[id]}" fill="${OTHER_GREY}" fill-rule="evenodd" tabindex="0" role="button" aria-label="${DISTRICTS.find(d=>d.id===id).name}"/>`).join('');
let lastRes=null, selId=null, popPos=null;
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
let mapMode='win';
const mapBtns=document.getElementById('mapBtns');
(function buildBtns(){
  const keys=[...NAMED].sort((a,b)=>OFFICIAL_NATIONAL[b]-OFFICIAL_NATIONAL[a]);
  let h=`<button class="btn" data-m="win" aria-pressed="true">Largest party</button>`;
  keys.forEach(k=>{ h+=`<button class="btn" data-m="${k}" aria-pressed="false" title="${nm(k)}"><i style="background:${col(k)}"></i>${k}</button>`; });
  mapBtns.innerHTML=h;
})();
mapBtns.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  mapMode=b.dataset.m;
  mapBtns.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(lastRes) renderMap(lastRes);
});
function isIGKey(k){return k==='IND'||k==='IG17';}
function partyShare(r,k){
  if(k==='IND') return r.igVotes!=null?r.igVotes/r.valid:r.rows.filter(x=>isIGKey(x.key)).reduce((a,x)=>a+x.share,0);
  const x=r.rows.find(y=>y.key===k); return x?x.share:0;
}
function renderMap(res){
  lastRes=res;
  const mode=mapMode;
  const keyEl=document.getElementById('mapkey');
  if(mode==='win'){
    const wins={};
    res.districts.forEach(r=>{
      const p=mapEl.querySelector(`path[data-id="${r.id}"]`);
      if(p){ p.setAttribute('fill',col(r.bonus)); p.removeAttribute('fill-opacity'); }
      wins[r.bonus]=(wins[r.bonus]||0)+1;
    });
    keyEl.innerHTML=Object.keys(wins).sort((a,b)=>wins[b]-wins[a]).map(k=>`<span><i style="background:${col(k)}"></i>${k} ${wins[k]}</span>`).join('');
  } else {
    const c=col(mode==='IND'?'IND':mode);
    const vals=res.districts.map(r=>({r,v:partyShare(r,mode)}));
    const max=Math.max(...vals.map(x=>x.v),1e-9);
    vals.forEach(({r,v})=>{
      const p=mapEl.querySelector(`path[data-id="${r.id}"]`);
      if(p){ p.setAttribute('fill',c); p.setAttribute('fill-opacity',(0.1+0.9*(v/max)).toFixed(3)); }
    });
    const top=vals.slice().sort((a,b)=>b.v-a.v).filter(x=>x.v>0).slice(0,3).map(x=>`<button class="lnk" data-d="${x.r.id}"><b>${x.r.name.replace(/ \(.*\)/,'')}</b> ${pc(x.v)}</button>`).join(', ');
    keyEl.innerHTML=`<div class="gradrow"><span>0%</span><span class="grad" style="background:linear-gradient(to right,${hexA(c,0.1)},${c})"></span><span>${pc(max)}</span></div>`+(top?`<div class="strong">Strongest in ${top}</div>`:'<div class="strong">No votes in any district in this scenario</div>');
  }
  if(selId) fillPop();
}
const isIG=k=>k==='IND'||k==='IG17';
function fillPop(){
  const r=lastRes.districts.find(d=>d.id===selId); if(!r) return;
  const sq=(k,n)=>Array.from({length:n},()=>`<i style="background:${col(k)}"></i>`).join('');
  const items=[];
  r.rows.filter(x=>!isIG(x.key)&&(x.share>=0.01||x.seats>0)).forEach(x=>{
    items.push({v:x.votes,share:x.share,label:`<span>${x.key==='NDFo'?'JPF':x.key}</span>`,color:col(x.key),sq:x.seats?sq(x.key,x.seats):''});
  });
  if(r.igVotes!=null){
    const igRows=r.rows.filter(x=>isIG(x.key)); const igSeats=igRows.reduce((a,x)=>a+x.seats,0); const sh=r.igVotes/r.valid;
    if(sh>=0.01||igSeats>0) items.push({v:r.igVotes,share:sh,label:'<span>Independents</span>',color:col('IND'),sq:igRows.map(x=>x.seats?sq(x.key,x.seats):'').join('')});
  }
  items.sort((a,b)=>b.v-a.v);
  let h=`<button class="x" aria-label="Close">×</button><h3>${r.name}</h3><p class="sub">${r.seatsTotal} seats · ${fmt(r.valid)} valid votes</p><div class="plist">`;
  items.forEach(x=>{
    h+=`<div class="pr"><span class="pn"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;flex:none;background:${x.color}"></i>${x.label}</span><span class="pc">${pc(x.share)}</span><span class="sqs">${x.sq}</span></div>`;
  });
  h+='</div>';
  popEl.innerHTML=h;
  popEl.querySelector('.x').addEventListener('click',closePop);
}
function placePop(){
  const w=wrapEl.getBoundingClientRect(), pw=popEl.offsetWidth, ph=popEl.offsetHeight;
  let x=popPos.x-pw/2; x=Math.max(4,Math.min(x,w.width-pw-4));
  let y=popPos.y+16; if(y+ph>w.height-4) y=Math.max(4,popPos.y-ph-16);
  popEl.style.left=x+'px'; popEl.style.top=y+'px';
}
function openPop(id,x,y){
  if(selId){const o=mapEl.querySelector(`path[data-id="${selId}"]`); if(o) o.classList.remove('sel');}
  selId=id; const p=mapEl.querySelector(`path[data-id="${id}"]`);
  p.classList.add('sel'); mapEl.appendChild(p);
  const w=wrapEl.getBoundingClientRect();
  popPos={x:x-w.left,y:y-w.top};
  popEl.hidden=false; fillPop(); placePop();
}
function closePop(){
  if(selId){const o=mapEl.querySelector(`path[data-id="${selId}"]`); if(o) o.classList.remove('sel');}
  selId=null; popEl.hidden=true;
}
mapEl.addEventListener('click',e=>{
  const p=e.target.closest('path'); if(!p){closePop();return;}
  if(selId===p.dataset.id){closePop();return;}
  openPop(p.dataset.id,e.clientX,e.clientY);
});
mapEl.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const p=e.target.closest('path'); if(!p) return; e.preventDefault();
  if(selId===p.dataset.id){closePop();return;}
  const b=p.getBoundingClientRect(); openPop(p.dataset.id,b.left+b.width/2,b.top+b.height/2);
});
document.getElementById('mapkey').addEventListener('click',e=>{
  const b=e.target.closest('.lnk'); if(!b) return;
  const id=b.dataset.d;
  if(selId===id){closePop();return;}
  const p=mapEl.querySelector(`path[data-id="${id}"]`).getBoundingClientRect();
  openPop(id,p.left+p.width/2,p.top+p.height/2);
});
document.addEventListener('click',e=>{ if(selId&&!popEl.contains(e.target)&&!e.target.closest('#map path')&&!e.target.closest('.lnk')) closePop(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&selId) closePop(); });
window.addEventListener('resize',()=>{ if(selId&&popPos) placePop(); });

// ---------- majority builder ----------
let coal=null; const segs={};
function renderBuilder(tot,arr,lead){
  if(coal===null) coal=new Set([lead]);
  [...coal].forEach(k=>{ if(!tot[k]) coal.delete(k); });
  document.getElementById('cchips').innerHTML=arr.map(k=>`<button class="cchip" data-k="${k}" aria-pressed="${coal.has(k)}" style="--c:${col(k)}"><i></i>${lab(k)} <b>${tot[k]}</b></button>`).join('');
  const fill=document.getElementById('cfill');
  const sel=[...coal];
  let sum=0;
  Object.keys(segs).forEach(k=>{ if(!tot[k]||!coal.has(k)) segs[k].style.width='0%'; });
  sel.forEach((k,i)=>{
    if(!segs[k]){ const d=document.createElement('div'); d.className='cseg'; d.style.background=col(k); d.title=lab(k); fill.appendChild(d); segs[k]=d; }
    segs[k].style.background=col(k); segs[k].style.order=i; segs[k].style.width=(100*tot[k]/225)+'%'; sum+=tot[k];
  });
  const names=sel.map(lab).join(' + ')||'No parties selected';
  document.getElementById('csum').innerHTML = sel.length
    ? `<b>${names}</b>: ${sum} seats. `+(sum>=113?`That is a majority, ${sum-112} past the 113 needed.`:`${113-sum} short of the 113 needed.`)
    : 'Select a party above to start.';
}
document.getElementById('cchips').addEventListener('click',e=>{
  const b=e.target.closest('.cchip'); if(!b) return;
  const k=b.dataset.k; if(coal.has(k)) coal.delete(k); else coal.add(k);
  update();
});

// ---------- update loop ----------
function update(fromUser){
  const sum=NAMED.reduce((a,p)=>a+(state[p]||0),0);
  const oth=100-sum;
  const othEl=document.getElementById('othersVal');
  othEl.textContent=Math.max(0,oth).toFixed(1)+'%';
  const al=document.getElementById('alert'), res=document.getElementById('results');
  if(oth<-0.0001){
    al.hidden=false; al.textContent=`These shares add up to ${sum.toFixed(2)}%. Reduce them to 100% or less to update the projection.`;
    res.classList.add('stale'); return;
  }
  res.classList.remove('stale');
  al.hidden=true;
  const shares={}; NAMED.forEach(p=>shares[p]=(state[p]||0)/100);
  const r=project(shares,mode);
  render(r,shares);
}

document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.preset)));

buildInputs();
update();
})();
